<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>
    <div class="model-overlay">
     <div class="order-modal">
        <button class="close-btn" onclick="closeForm()">×</button>
        <h2>ORDER</h2>
        
        <div class="success-message" id="successMessage">
            Order placed successfully!
        </div>

        <form id="orderForm" novalidate>
            <div class="form-group">
                <label for="fullname">Name and surname</label>
                <input type="text" id="fullname" name="fullname" placeholder="">
                <div class="error-message" id="fullnameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="">
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="promo">Promo</label>
                <div class="promo-group">
                    <input type="text" id="promo" name="promo" placeholder="">
                    <button type="button" class="apply-btn" onclick="applyPromo()">Apply</button>
                </div>
                <div class="error-message" id="promoError"></div>
            </div>

            <div class="form-group">
                <label for="phone">Cell phone</label>
                <div class="phone-group">
                    <input type="text" id="countryCode" class="country-code" value="+994" readonly>
                    <select id="phonePrefix" class="phone-select">
                        <option value="10">10</option>
                        <option value="50">50</option>
                        <option value="51">51</option>
                        <option value="55">55</option>
                        <option value="70">70</option>
                        <option value="77">77</option>
                        <option value="99">99</option>
                    </select>
                    <input type="tel" id="phone" name="phone" class="phone-number" placeholder="" maxlength="7">
                </div>
                <div class="error-message" id="phoneError"></div>
            </div>

            <div class="form-group">
                <label for="payment">Payment</label>
                <select id="payment" name="payment">
                    <option value="visa">Visa bank card</option>
                    <option value="mastercard">Mastercard</option>
                    <option value="amex">American Express</option>
                    <option value="paypal">PayPal</option>
                </select>
                <div class="error-message" id="paymentError"></div>
            </div>

            <div class="form-group">
                <div class="card-input-wrapper">
                    <input type="text" id="cardNumber" name="cardNumber" placeholder="" maxlength="19">
                    <div class="card-icon">💳</div>
                </div>
                <div class="error-message" id="cardError"></div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember card information</label>
            </div>

            <button type="submit" class="purchase-btn">Purchase</button>
        </form>
        
    </div>
    </div>
    <script src="../js/checkout.js"></script>
</body>
</html>
