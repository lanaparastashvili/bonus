<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/seats.css">
    
</head>

<body>
    <div class="poster-container">
        <div class="poster-bg"></div>

        <div class="clouds">
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
        </div>

        <div class="logo">
            <div class="logo-circle">
                <div class="logo-half"><img src="../img/1.png" alt=""></div>
                <div class="movie-duration">Spirited away 1 h. 18 m</div>
                <div class="line"></div>

            </div>


        </div>




    </div>
    <div class="container">
        <div class="user-icon"><img src="" alt=""></div>

        <div class="section-title">Date</div>
        <div class="date-selector" id="dateSelector"></div>

        <div class="divider"></div>

        <div class="section-title">Time</div>
        <div class="time-selector" id="timeSelector"></div>

        <div class="divider"></div>

        <div class="screen"></div>

        <div class="seats-container" id="seatsContainer"></div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot available"></div>
                <span>Available</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot booked"></div>
                <span>Booked</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot selected"></div>
                <span>Selected</span>
            </div>
        </div>
        <div class="container1">
            <h1>SELECTED SEATS</h1>

            <div class="selected-seats">
              
            </div>

            <button class="purchase-btn">Purchase (48$)</button>

            <div class="timer">Time left to purchase: 10:15</div>
        </div>
    </div>


    </div>
    <div id="modalContainer" style="display:none;"></div>
    <script src="../js/seats.js"></script>
</body>

</html>
